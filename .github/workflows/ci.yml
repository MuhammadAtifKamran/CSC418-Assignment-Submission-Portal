name: CSC418 Automated Tests and Local Report

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-report:
    name: Test and Deliver Local JSON Report
    runs-on:
      - self-hosted
      - Windows
      - X64
      - csc418

    env:
      REPORT_RECEIVER_URL: http://127.0.0.1:4000/reports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Create report artifacts directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path artifacts

      - name: Execute automated tests
        id: tests
        continue-on-error: true
        shell: powershell
        run: npm test -- --json --outputFile=artifacts/jest-results.json

      - name: Build structured JSON report
        if: always()
        shell: powershell
        run: npm run report:build

      - name: Send report to local receiver
        if: always()
        shell: powershell
        run: npm run report:send

      - name: Preserve failed test status
        if: steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "One or more automated tests failed."
          exit 1
          