name: CSC418 Tests, Local Report and Pages Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: csc418-pages
  cancel-in-progress: false

jobs:
  test-and-report:
    name: Test and Deliver Local JSON Report

    runs-on:
      - self-hosted
      - Windows
      - X64
      - csc418

    env:
      REPORT_RECEIVER_URL: http://127.0.0.1:4000/reports

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify Node.js
        shell: powershell
        run: |
          node --version
          npm --version

      - name: Install dependencies
        shell: powershell
        run: npm ci

      - name: Create report artifacts directory
        shell: powershell
        run: New-Item -ItemType Directory -Force -Path artifacts

      - name: Execute automated tests
        id: tests
        continue-on-error: true
        shell: powershell
        run: npm test -- --json --outputFile=artifacts/jest-results.json

      - name: Build structured JSON report
        if: always()
        shell: powershell
        run: npm run report:build

      - name: Send report to local receiver
        if: always()
        shell: powershell
        run: npm run report:send

      - name: Send email test report
        if: always()
        shell: powershell
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_APP_PASSWORD: ${{ secrets.SMTP_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: npm run report:email

      - name: Preserve failed test status
        if: always() && steps.tests.outcome == 'failure'
        shell: powershell
        run: |
          Write-Error "One or more automated tests failed."
          exit 1

  prepare-pages:
    name: Prepare GitHub Pages Artifact

    needs:
      - test-and-report

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - name: Check out tested revision
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static frontend
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy-pages:
    name: Deploy Portal to GitHub Pages

    needs:
      - prepare-pages

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4